spring.application.name=wardrobe

# Railway injects PORT. Local runs stay on 8080.
server.port=${PORT:8080}
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=framework

# Railway Postgres variables when they are set on this service.
# Defaults keep the local database.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:Boutique}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:Arunask@12}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

jwt.secret=${JWT_SECRET:mysecretmysecretmysecretmysecret}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Product pictures are stored in the database, so keep them small.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Comma-separated origin patterns. Set this to the deployed frontend URL.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
